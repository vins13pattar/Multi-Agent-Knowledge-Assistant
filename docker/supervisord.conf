[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgres]
command=/app/docker/start-postgres.sh
autostart=true
autorestart=true
priority=10
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err.log

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save ""
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log

[program:chromadb]
command=chroma run --host 0.0.0.0 --port 8001 --path /data/chroma
environment=ANONYMIZED_TELEMETRY="False"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/chromadb.log
stderr_logfile=/var/log/supervisor/chromadb.err.log

[program:api]
command=/app/docker/start-api.sh
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err.log

[program:streamlit]
command=/app/docker/start-streamlit.sh
directory=/app
autostart=true
autorestart=true
priority=40
startsecs=5
stdout_logfile=/var/log/supervisor/streamlit.log
stderr_logfile=/var/log/supervisor/streamlit.err.log
