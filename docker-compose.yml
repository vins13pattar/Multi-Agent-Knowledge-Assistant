version: '3.8'

# Standard multi-container setup: each service (API, UI, Postgres, Redis,
# ChromaDB) runs in its own container. Used for local development and for
# deployment alike — for a real production deployment, drop the `volumes:
# .:/app` mounts and the `--reload` flag below (they exist for local
# hot-reload only).
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: knowledge_assistant_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/knowledge_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    restart: on-failure
    volumes:
      - .:/app
    command: >-
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: knowledge_assistant_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - .:/app

  postgres:
    image: postgres:15-alpine
    container_name: knowledge_assistant_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=knowledge_db
    healthcheck:
      # Probe TCP, not the Unix socket — during first-boot initdb Postgres
      # briefly reports ready on the socket, then shuts down before it
      # listens on 0.0.0.0:5432. Checking 127.0.0.1 avoids that race.
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_db -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    # No host port mapping — other containers reach this over the compose
    # network at postgres:5432. Uncomment (bound to loopback only) to debug
    # with a host client; never publish this on a shared/deployed host.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:0.5.3
    container_name: knowledge_assistant_chroma
    # No host port mapping — reached internally at chromadb:8000.
    # ports:
    #   - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  redis:
    image: redis:7-alpine
    container_name: knowledge_assistant_redis
    # No host port mapping — reached internally at redis:6379. Not currently
    # used by the application (reserved for future rate limiting / state).
    # ports:
    #   - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
  chroma_data:
